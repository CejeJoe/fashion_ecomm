<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Élégante</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body.login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .login-container {
            width: 100%;
            max-width: none;
            grid-template-columns: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
        }
        .login-form-box {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-form-box">
            <h2 style="text-align: center; color: #224F34; margin-bottom: 8px;">Élégante</h2>
            <h3 style="text-align: center; color: #666; font-size: 18px; font-weight: 500; margin-top: 0; margin-bottom: 24px;">Member Login</h3>
            <p style="text-align: center; color: #999; margin-bottom: 24px;">Sign in to your account to shop and track orders.</p>
            <form id="login-form">
                <label for="login-email" style="display: block; margin-bottom: 8px; font-weight: 500; color: #224F34;">Email Address</label>
                <input type="email" id="login-email" name="email" placeholder="your@email.com" style="width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                
                <label for="login-password" style="display: block; margin-bottom: 8px; font-weight: 500; color: #224F34;">Password</label>
                <input type="password" id="login-password" name="password" placeholder="Enter your password" style="width: 100%; padding: 10px; margin-bottom: 24px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                
                <button type="submit" class="btn" style="width: 100%; padding: 12px; background-color: #224F34; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 500;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 16px; font-size: 14px; color: #666;">
                Don't have an account? <a href="#" style="color: #224F34; text-decoration: underline;">Create one</a>
            </p>
            <p style="text-align: center; margin-top: 20px; font-size: 12px; color: #999;">
                <a href="fashion.html" style="color: #224F34; text-decoration: none;">Bacsk to Home</a>
            </p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        
        const emailError = document.createElement('div');
        emailError.style.cssText = 'color:#c00;font-size:12px;margin-top:4px;margin-bottom:8px';
        emailInput.parentNode.insertBefore(emailError, emailInput.nextSibling);
        
        const passwordError = document.createElement('div');
        passwordError.style.cssText = 'color:#c00;font-size:12px;margin-top:4px;margin-bottom:8px';
        passwordInput.parentNode.insertBefore(passwordError, passwordInput.nextSibling);
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            let isValid = true;

            if (!email) {
                emailError.textContent = 'Please enter email';
                emailInput.style.borderColor = 'red';
                isValid = false;
            } else {
                emailError.textContent = '';
                emailInput.style.borderColor = '';
            }

            if (!password) {
                passwordError.textContent = 'Please enter password';
                passwordInput.style.borderColor = 'red';
                isValid = false;
            } else {
                passwordError.textContent = '';
                passwordInput.style.borderColor = '';
            }

            if (isValid) {
                localStorage.setItem('user', JSON.stringify({ email, loggedIn: true }));
                alert('Welcome to Élégante, ' + email);
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
